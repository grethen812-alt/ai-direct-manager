[project]
name = "yandex-ads-mcp"
version = "1.3.0"
description = "MCP server for Yandex Direct, Yandex Metrika, Yandex Audience, and Wordstat APIs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp==1.30.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "certifi==2026.11.20",
]

[project.scripts]
yandex-ads-mcp = "server:main_sync"
yandex-ads-mcp-phase1 = "phase1_readonly:main_sync"
yandex-ads-mcp-phase1-demo = "phase1_demo:main_sync"

[tool.setuptools]
py-modules = ["server", "phase1_readonly", "phase1_reports", "phase1_demo", "tools_direct_extra", "tools_metrika", "tools_audience"]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"
