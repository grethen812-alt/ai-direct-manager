name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
          python -m pip check

      - name: Run offline safety tests
        run: |
          python test_safety.py
          python -m unittest -v test_phase1_readonly test_phase1_reports

      - name: Check installed entry points
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from importlib.metadata import distribution

          entries = {entry.name: entry for entry in distribution("yandex-ads-mcp").entry_points}
          for name in ("yandex-ads-mcp", "yandex-ads-mcp-phase1", "yandex-ads-mcp-phase1-demo"):
              assert callable(entries[name].load())
          PY
